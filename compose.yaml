name: moduledev-week-3

# Десять сервисов, одна публичная точка входа.
#
#   gateway            - публичный C# ASP.NET Core шлюз, единственный сервис с host-портом
#   api                - внутренний C# движок исполнения действий, доступен только по сети Compose
#   cli                - Course CLI: миграции, публикация действий и карт, trusted-команды процессов
#                        (тремя разными ролями: миграций, публикации и операций)
#   postgres           - авторитетное состояние в именованном томе (volume)
#   worker-a, worker-b - два экземпляра ОДНОГО образа сменного исполнителя процессов
#   outbox-dispatcher  - Python: durable Outbox (PostgreSQL) -> provider v0.2.0
#   receipt-adapter    - Python, тот же образ: legacy callback provider -> signed receipt v1 -> gateway
#   inbox-reconciler   - Python, тот же образ: фиксированная SQL-граница согласования Inbox
#   provider-simulator - выданный внешний provider v0.2.0, закреплён по digest
#
# Пароли PostgreSQL ниже — явно обозначенные local-only значения для разработки, а НЕ настоящие
# секреты; проверка всегда подменяет их synthetic-значениями. У JWT, HMAC, capability и токенов
# значений по умолчанию нет вовсе: они приходят только из окружения запуска (см. README, «Запуск»).
#
# Стек самодостаточен: ни одного bind mount, ни одного внешнего ресурса. Миграции, встроенные
# манифесты действий, карты процессов и скрипт создания ролей копируются ВНУТРЬ образов на этапе
# сборки, поэтому "docker compose up -d --build" на чистой машине не требует ручных шагов.

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COURSE_POSTGRES_PASSWORD:-course_local_superuser}
      COURSE_MIGRATOR_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-course_local_migrator}
      COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-course_local_publisher}
      COURSE_RUNTIME_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-course_local_runtime}
      COURSE_OPERATOR_PASSWORD: ${COURSE_OPERATOR_PASSWORD:-course_local_operator}
      COURSE_WORKER_PASSWORD: ${COURSE_WORKER_PASSWORD:-course_local_worker}
      COURSE_OUTBOX_PASSWORD: ${COURSE_OUTBOX_PASSWORD:-course_local_outbox}
      COURSE_INBOX_PASSWORD: ${COURSE_INBOX_PASSWORD:-course_local_inbox}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # Именованный том: состояние процессов переживает пересоздание любого контейнера, включая
      # оба worker'а — это ровно то свойство, которое проверяется сценарием recreate.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    environment:
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      # Роль МИГРАЦИЙ: нужна только команде migration apply, потому что DDL требует прав
      # владельца. Сервисам api и worker эти учётные данные не передаются никогда.
      COURSE_POSTGRES_USER: course_migrator
      COURSE_POSTGRES_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-course_local_migrator}
      # Роль ПУБЛИКАЦИИ: под ней идут команды action * и flow *. Ни DDL, ни предметных таблиц,
      # ни очереди заданий — только каталог действий, определения карт и trusted-команды.
      COURSE_PUBLISHER_USER: course_publisher
      COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-course_local_publisher}
      # Роль ОПЕРАЦИЙ: под ней идут команды, двигающие процессы (flow start/get/signal и проба
      # fencing). Публиковать карты или действия она не может — и наоборот.
      COURSE_OPERATOR_USER: course_operator
      COURSE_OPERATOR_PASSWORD: ${COURSE_OPERATOR_PASSWORD:-course_local_operator}
      COURSE_APPLICATION_NAME: course-cli
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    # По умолчанию контейнер cli выполняет команду "bootstrap" (см. CMD в docker/cli.Dockerfile)
    # и завершается — restart "no" означает "не перезапускать его после выхода".
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      COURSE_JWT_ISSUER: ${COURSE_JWT_ISSUER}
      COURSE_JWT_AUDIENCE: ${COURSE_JWT_AUDIENCE}
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY}
      # Ключ общей границы подписанных запросов: api проверяет X-Provider-Signature над точными
      # байтами тела. Кроме api, этот секрет получает только receipt-adapter.
      PROVIDER_HMAC_SECRET: ${PROVIDER_HMAC_SECRET}
      # api подключается от лица RUNTIME-роли (course_runtime): у неё нет прав менять каталог
      # действий или структуру базы, только выполнять api.invoke и читать проверочные проекции.
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      COURSE_POSTGRES_USER: course_runtime
      COURSE_POSTGRES_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-course_local_runtime}
      COURSE_APPLICATION_NAME: course-api
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      # Настройки из README пробрасываются из окружения запуска; пустое значение — умолчание процесса.
      COURSE_MAX_RESULT_BYTES: ${COURSE_MAX_RESULT_BYTES:-}
      COURSE_DISPATCH_QUEUE_CAPACITY: ${COURSE_DISPATCH_QUEUE_CAPACITY:-}
    # expose (в отличие от ports) делает порт видимым только другим сервисам ВНУТРИ сети Compose.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Внутренний api адресуется именем сервиса Compose, а не через localhost: DNS этого имени
      # разрешается сетью Docker и продолжает работать после пересоздания контейнера api.
      COURSE_API_BASE_URL: http://api:8080
      COURSE_GATEWAY_UPSTREAM_TIMEOUT: ${COURSE_GATEWAY_UPSTREAM_TIMEOUT:-}
      COURSE_GATEWAY_MAX_RESPONSE_BYTES: ${COURSE_GATEWAY_MAX_RESPONSE_BYTES:-}
    ports:
      - "127.0.0.1:${COURSE_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Два арендатора очереди заданий. Один образ, разные lease owner.
  #
  # depends_on намеренно НЕ объявлен: worker обязан переживать недоступность базы и незавершённые
  # миграции самостоятельно (он просто продолжает опрашивать очередь), и тогда его пересоздание
  # никогда не тянет за собой пересоздание postgres или api. Именно этого требуют сценарии
  # аварийного завершения: проверка пересоздаёт worker'ов, не трогая авторитетное состояние.
  #
  # restart "no" — тоже осознанно: убитый worker должен ОСТАВАТЬСЯ убитым, иначе доказать
  # перехват аренды вторым исполнителем было бы невозможно.
  # --------------------------------------------------------------------------
  worker-a:
    image: moduledev-week-2-workflow-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      # Идентификатор арендатора — единственное, чем два экземпляра отличаются друг от друга.
      COURSE_WORKER_ID: worker-a
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      # Минимально привилегированная роль: EXECUTE ровно на четыре функции-границы и ни одного
      # права на таблицы (см. 015_workflow_autocheck.sql).
      COURSE_POSTGRES_USER: workflow_worker
      COURSE_POSTGRES_PASSWORD: ${COURSE_WORKER_PASSWORD:-course_local_worker}
      COURSE_APPLICATION_NAME: course-worker
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}
      COURSE_WORKER_LEASE_MS: ${COURSE_WORKER_LEASE_MS:-}
      COURSE_WORKER_POLL_MS: ${COURSE_WORKER_POLL_MS:-}
      COURSE_MAX_RESULT_BYTES: ${COURSE_MAX_RESULT_BYTES:-}
    stop_grace_period: 5s
    restart: "no"

  # Сборка объявлена ТОЛЬКО у worker-a. Это не экономия строк: два build-раздела с одним и тем же
  # тегом образа собираются параллельно и гонятся за одну и ту же ссылку — сборка периодически
  # падает с «image ... already exists». Один образ должен собираться ровно один раз, а второй
  # арендатор просто на него ссылается.
  worker-b:
    image: moduledev-week-2-workflow-worker:local
    # Образ собирает worker-a; тянуть его из реестра нечего и незачем, поэтому попытка pull
    # должна быть явной ошибкой конфигурации, а не невнятным отказом сети.
    pull_policy: never
    environment:
      COURSE_WORKER_ID: worker-b
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      COURSE_POSTGRES_USER: workflow_worker
      COURSE_POSTGRES_PASSWORD: ${COURSE_WORKER_PASSWORD:-course_local_worker}
      COURSE_APPLICATION_NAME: course-worker
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}
      COURSE_WORKER_LEASE_MS: ${COURSE_WORKER_LEASE_MS:-}
      COURSE_WORKER_POLL_MS: ${COURSE_WORKER_POLL_MS:-}
      COURSE_MAX_RESULT_BYTES: ${COURSE_MAX_RESULT_BYTES:-}
    stop_grace_period: 5s
    restart: "no"

  # --------------------------------------------------------------------------
  # Python-периметр недели 3: ОДИН локально собранный образ, три entrypoint.
  #
  # Сборка объявлена только у outbox-dispatcher — по той же причине, что у worker-a: два build с
  # одним тегом гоняются за одну ссылку. Остальные два сервиса ссылаются на уже собранный образ.
  #
  # Ни у одного Python-сервиса нет host-порта и depends_on: процессы сами переживают
  # недоступность базы или gateway, а их пересоздание не тянет за собой пересоздание ядра.
  # --------------------------------------------------------------------------
  outbox-dispatcher:
    image: moduledev-week-3-integration:local
    build:
      context: .
      dockerfile: docker/integration.Dockerfile
    command: ["outbox-dispatcher"]
    environment:
      PROVIDER_URL: ${PROVIDER_URL:-http://provider-simulator:8081}
      OUTBOX_OWNER: ${OUTBOX_OWNER:-outbox-dispatcher}
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      # Отдельная роль: EXECUTE ровно на delivery.claim_outbox / succeed_outbox / fail_outbox.
      COURSE_POSTGRES_USER: outbox_dispatcher
      COURSE_POSTGRES_PASSWORD: ${COURSE_OUTBOX_PASSWORD:-course_local_outbox}
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-}
      COURSE_POSTGRES_STATEMENT_TIMEOUT_MS: ${COURSE_POSTGRES_STATEMENT_TIMEOUT_MS:-}
    stop_grace_period: 5s
    restart: unless-stopped

  receipt-adapter:
    image: moduledev-week-3-integration:local
    # Без pull_policy, в отличие от worker-b: проверка недели 3 считает любое значение, кроме
    # build, признаком чужого образа у Python-сервисов («must run the locally built image»).
    command: ["receipt-adapter"]
    # Ни одной переменной подключения к PostgreSQL: adapter физически не может тронуть состояние
    # в обход generic API и не хранит ничего авторитетного.
    environment:
      PROVIDER_CALLBACK_CAPABILITY: ${PROVIDER_CALLBACK_CAPABILITY}
      PROVIDER_CALLBACK_TOKEN: ${PROVIDER_CALLBACK_TOKEN}
      PROVIDER_HMAC_SECRET: ${PROVIDER_HMAC_SECRET}
      RECEIPT_API_URL: ${RECEIPT_API_URL:-http://gateway:8080/api/receipt/accept}
      # Порт закреплён: на него ссылаются expose ниже и callback URL provider. Адрес и бюджет
      # ожидания API — настройки из README.
      RECEIPT_ADAPTER_PORT: "8082"
      RECEIPT_ADAPTER_HOST: ${RECEIPT_ADAPTER_HOST:-}
      RECEIPT_API_TIMEOUT_MS: ${RECEIPT_API_TIMEOUT_MS:-}
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
    expose:
      - "8082"
    stop_grace_period: 5s
    restart: unless-stopped

  inbox-reconciler:
    image: moduledev-week-3-integration:local
    command: ["inbox-reconciler"]
    environment:
      COURSE_POSTGRES_HOST: postgres
      COURSE_POSTGRES_PORT: 5432
      COURSE_POSTGRES_DB: course
      # Отдельная роль: EXECUTE ровно на delivery.reconcile_inbox.
      COURSE_POSTGRES_USER: inbox_reconciler
      COURSE_POSTGRES_PASSWORD: ${COURSE_INBOX_PASSWORD:-course_local_inbox}
      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      INBOX_POLL_INTERVAL_MS: ${INBOX_POLL_INTERVAL_MS:-}
      INBOX_BATCH_SIZE: ${INBOX_BATCH_SIZE:-}
      COURSE_POSTGRES_STATEMENT_TIMEOUT_MS: ${COURSE_POSTGRES_STATEMENT_TIMEOUT_MS:-}
    stop_grace_period: 5s
    restart: unless-stopped

  # Выданный внешний компонент. Закреплён по digest: тег можно переписать, digest — нет.
  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0@sha256:70e5e0dd9ab8425be84de431ec74516f9bedf5d5529077358e2e2b2037fe0c74
    environment:
      # Provider не знает про receipt v1 и не подписывает callback: доверие к нему ограничено
      # сетью Compose и непредсказуемым capability-сегментом пути.
      CALLBACK_URL: http://receipt-adapter:8082/callbacks/provider-v02/${PROVIDER_CALLBACK_CAPABILITY}
      SIMULATOR_MODE: ${PROVIDER_SIMULATOR_MODE:-success}
      CALLBACK_DELAY: 200ms
      CALLBACK_TIMEOUT: 1s
      CALLBACK_MAX_ATTEMPTS: "5"
      CALLBACK_RETRY_DELAY: 200ms
      AUDIT_TOKEN: ${PROVIDER_AUDIT_TOKEN}
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  postgres-data:
